[project]
name = "certan-kel-15"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "numpy>=1.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
